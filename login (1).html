<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login — Noerz Activator</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
<style>
  :root{
    --bg:#08080a;
    --surface:rgba(255,255,255,0.04);
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.14);
    --border-glow:rgba(255,255,255,0.3);
    --text:#f5f5f7;
    --text-secondary:#9a9aa2;
    --text-tertiary:#68686f;
    --radius-sm:10px;
    --radius-md:14px;
    --radius-full:9999px;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --glow-sm:0 0 16px rgba(255,255,255,0.06);
    --glow-md:0 0 24px rgba(255,255,255,0.12);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;overflow-x:clip;}
  body{
    overflow-x:hidden;overflow-x:clip;
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;min-height:100vh;font-size:15px;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  :focus{outline:none;}
  :focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:6px;}

  .container-sm{width:100%;max-width:440px;margin:0 auto;padding:0 16px;box-sizing:border-box;}

  .nav{
    position:sticky;top:0;z-index:100;
    background:rgba(8,8,10,0.75);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-bottom:0.5px solid var(--border);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:56px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--text);}
  .brand img{width:28px;height:28px;border-radius:7px;object-fit:cover;}

  .page{
    padding:40px 0 64px;
    display:flex;align-items:center;
    min-height:calc(100vh - 56px);
  }
  .page-inner{width:100%;}

  .auth-logo{
    width:64px;height:64px;border-radius:16px;
    margin:0 auto 20px;object-fit:cover;
    box-shadow:0 0 32px rgba(255,255,255,0.15);
  }
  .auth-head{text-align:center;margin-bottom:28px;}
  .auth-head h1{
    font-size:26px;font-weight:800;
    letter-spacing:-0.02em;margin-bottom:6px;
  }
  .auth-head p{font-size:14px;color:var(--text-secondary);}

  .card{
    background:var(--surface);
    border:0.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:24px;
  }

  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:12.5px;font-weight:600;
    color:var(--text-secondary);margin-bottom:8px;
    letter-spacing:0.02em;
  }
  .field input{
    width:100%;padding:13px 15px;
    background:rgba(0,0,0,0.25);
    border:0.5px solid var(--border-strong);
    border-radius:var(--radius-sm);
    color:var(--text);font-family:inherit;font-size:15px;
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
  }
  .field input::placeholder{color:var(--text-tertiary);}
  .field input:focus{
    outline:none;border-color:rgba(255,255,255,0.4);
    background:rgba(0,0,0,0.35);
    box-shadow:0 0 0 3px rgba(255,255,255,0.08),0 0 20px rgba(255,255,255,0.06);
  }
  .field input.error{border-color:rgba(255,255,255,0.3);}

  .field-error{
    display:none;font-size:12px;color:var(--text-secondary);
    margin-top:6px;align-items:center;gap:5px;
  }
  .field-error.show{display:flex;}
  .field-error .bx{font-size:14px;flex-shrink:0;}

  .field-with-icon{position:relative;}
  .field-with-icon input{padding-right:44px;}
  .field-toggle{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:18px;color:var(--text-tertiary);
    line-height:1;transition:color .2s var(--ease);
  }
  .field-toggle:hover{color:var(--text);}

  .forgot-link{
    display:block;text-align:right;
    font-size:12.5px;color:var(--text-secondary);
    margin-top:-8px;margin-bottom:16px;
    transition:color .2s var(--ease);
  }
  .forgot-link:hover{color:#fff;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 24px;border-radius:var(--radius-full);
    font-size:14.5px;font-weight:700;
    width:100%;white-space:nowrap;cursor:pointer;
    transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
  }
  .btn:active:not(:disabled){transform:scale(0.98);}
  .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .btn .bx{font-size:18px;flex-shrink:0;}
  .btn-primary{
    background:#fff;color:var(--bg);
    box-shadow:0 0 24px rgba(255,255,255,0.2);
  }
  .btn-primary:hover:not(:disabled){
    background:#f5f5f7;
    box-shadow:0 0 40px rgba(255,255,255,0.35),0 0 80px rgba(255,255,255,0.15);
  }
  .btn .spinner{
    width:14px;height:14px;
    border:2px solid rgba(0,0,0,0.2);
    border-top-color:currentColor;border-radius:50%;
    animation:spin .7s linear infinite;display:none;flex-shrink:0;
  }
  .btn.loading .spinner{display:inline-block;}
  .btn.loading{pointer-events:none;opacity:0.7;}

  .auth-foot{
    text-align:center;margin-top:20px;
    font-size:13.5px;color:var(--text-secondary);
  }
  .auth-foot a{
    color:#fff;font-weight:600;
    text-decoration:underline;
    text-underline-offset:3px;
    text-decoration-color:rgba(255,255,255,0.3);
    transition:text-decoration-color .2s var(--ease);
  }
  .auth-foot a:hover{text-decoration-color:#fff;}

  .toast-wrap{
    position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:500;
    display:flex;flex-direction:column;gap:8px;
    width:calc(100% - 32px);max-width:400px;pointer-events:none;
  }
  .toast{
    background:rgba(20,20,24,0.95);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:0.5px solid rgba(255,255,255,0.15);
    border-radius:var(--radius-sm);padding:13px 15px;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 12px 40px -8px rgba(0,0,0,0.6),var(--glow-sm);
    animation:slideDown .3s var(--ease);pointer-events:auto;
    font-size:13.5px;word-wrap:break-word;
  }
  .toast .bx{font-size:19px;flex-shrink:0;color:#fff;}
  .toast.success{border-left:3px solid #fff;}
  .toast.error{border-left:3px solid rgba(255,255,255,0.5);}
  .toast.info{border-left:3px solid rgba(255,255,255,0.3);}

  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideDown{
    from{opacity:0;transform:translateY(-10px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body data-page="login">

<nav class="nav">
  <div class="container-sm nav-inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="Noerz Activator">
      <span>Noerz Activator</span>
    </a>
  </div>
</nav>

<main class="page">
  <div class="container-sm page-inner">

    <img src="assets/logo.png" alt="Noerz Activator" class="auth-logo">

    <div class="auth-head">
      <h1>Selamat Datang</h1>
      <p>Login untuk mulai aktivasi</p>
    </div>

    <div class="card">
      <form id="loginForm" novalidate>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="user@email.com" autocomplete="email" required>
          <div class="field-error" id="emailError">
            <i class='bx bx-error-circle'></i>
            <span>Masukkan email yang valid.</span>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field-with-icon">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="field-toggle" data-toggle-password="password" aria-label="Tampilkan password">
              <i class='bx bx-show'></i>
            </button>
          </div>
          <div class="field-error" id="passwordError">
            <i class='bx bx-error-circle'></i>
            <span>Password wajib diisi (min. 6 karakter).</span>
          </div>
        </div>

        <a href="forgot-password.html" class="forgot-link">Lupa password?</a>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-label">
            <i class='bx bx-log-in'></i> Login
          </span>
        </button>

      </form>
    </div>

    <div class="auth-foot">
      Belum punya akun? <a href="register.html">Daftar gratis</a>
    </div>

  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
